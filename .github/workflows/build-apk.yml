name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare signing (optional, from GitHub Secrets)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            {
              echo "storeFile=$GITHUB_WORKSPACE/release.jks"
              echo "storePassword=$KS_PASS"
              echo "keyAlias=$KS_ALIAS"
              echo "keyPassword=$KS_KEYPASS"
            } > keystore.properties
            echo "SIGNING=your release key" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug key (test only - not a final release key)" >> "$GITHUB_ENV"
          fi

      - name: Update PROJECT_INFO.txt
        run: |
          sed -i "s|^Build time:.*|Build time: $(date -u '+%Y-%m-%d %H:%M:%S')|; s|^Timezone:.*|Timezone: UTC|; s|^Signing:.*|Signing: ${SIGNING}|" PROJECT_INFO.txt
          cat PROJECT_INFO.txt

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MailSphere-APK
          path: |
            app/build/outputs/apk/release/*.apk
            PROJECT_INFO.txt
